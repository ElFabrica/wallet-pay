services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-pay-postgres
    environment:
      POSTGRES_DB: wallet_pay
      POSTGRES_USER: wallet_pay
      POSTGRES_PASSWORD: wallet_pay
    ports:
      - "5432:5432"
    volumes:
      - wallet_pay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_pay -d wallet_pay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wallet_pay_postgres_data:
